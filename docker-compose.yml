services:
  db:
    image: mariadb
    container_name: mariadb
    restart: always
    env_file: # 환경변수 파일
      - ./.env
    environment:
      TZ : "Asia/Seoul"
      MARIADB_USER: ${MARIADB_USER}
      MARIA_DB_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - ./db/conf.d:/etc/mysql/conf.d
      - ./db/initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  redis:
    image: redis
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli","ping" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  server:
    build: ./   # 서버 소스코드 Dockerfile 경로
    container_name: server
    restart: always
    env_file: # 환경변수 파일
      - ./.env
    ports:
      - "3000:3000"
    depends_on:
      db :
        condition: service_healthy
      redis :
        condition: service_healthy
    networks:
      - default